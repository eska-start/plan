<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>여행 플랜 기록</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
    <style>@keyframes _ld{to{transform:rotate(360deg)}}</style>
  </head>

  <body>
    <div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff"><div style="width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#5BB4D8;border-radius:50%;animation:_ld 0.8s linear infinite"></div></div></div>
    <script>
      (function () {
        var key = "__boot_retry_once__";
        setTimeout(function () {
          if (window.__APP_BOOTSTRAPPED__) return;
          if (sessionStorage.getItem(key)) return;
          sessionStorage.setItem(key, "1");
          var url = new URL(window.location.href);
          url.searchParams.set("_r", String(Date.now()));
          window.location.replace(url.toString());
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
