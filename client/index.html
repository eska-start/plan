<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>여행 플랜 기록</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
    <style>@keyframes _ld{to{transform:rotate(360deg)}}</style>
  </head>

  <body>
    <div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff"><div style="width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#5BB4D8;border-radius:50%;animation:_ld 0.8s linear infinite"></div></div></div>
    <script>
      (function () {
        var key = "__reload_once__";
        var bfcacheKey = "__bfcache_reload_once__";
        function ssGet(k) {
          try { return sessionStorage.getItem(k); } catch { return null; }
        }
        function ssSet(k, v) {
          try { sessionStorage.setItem(k, v); } catch {}
        }
        function reloadOnce(tag) {
          if (ssGet(key)) return;
          ssSet(key, "1");
          var url = new URL(window.location.href);
          url.searchParams.set(tag, String(Date.now()));
          window.location.replace(url.toString());
        }

        setTimeout(function () {
          if (window.__APP_BOOTSTRAPPED__) return;
          reloadOnce("_boot");
        }, 6000);

        window.addEventListener("error", function (e) {
          var msg = (e && e.message) || "";
          if (!/Importing a module script failed|Failed to fetch dynamically imported module/i.test(msg)) return;
          reloadOnce("_m");
        });

        window.addEventListener("unhandledrejection", function (e) {
          var reason = (e && e.reason && (e.reason.message || String(e.reason))) || "";
          if (!/Failed to fetch dynamically imported module|Importing a module script failed/i.test(reason)) return;
          reloadOnce("_m");
        });

        // iOS Safari bfcache 복귀(뒤로가기→앞으로가기) 시 오래된 런타임으로 흰 화면이 남는 케이스 복구
        window.addEventListener("pageshow", function (e) {
          if (!e || !e.persisted) return;
          if (ssGet(bfcacheKey)) return;
          ssSet(bfcacheKey, "1");
          var u = new URL(window.location.href);
          u.searchParams.set("_ps", String(Date.now()));
          window.location.replace(u.toString());
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
